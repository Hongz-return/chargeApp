<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>订单结算 · 充电桩小程序演示版</title>
<style>

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: #eceff3;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Helvetica Neue', sans-serif;
  color: #1f2429;
  -webkit-font-smoothing: antialiased;
}

img { display: block; }

/* --------------------------------------------------------------- 手机框 */

.screen {
  position: relative;
  width: 375px;
  height: 812px;
  overflow: hidden;
  background: #f3f5f7;
  font-size: 14px;
  line-height: 1.4;
  flex-shrink: 0;
}

.wx-body {
  position: relative;
  overflow: hidden;
}

/* 小程序里的 fixed 是相对 webview 的，预览页里改成相对页面可视区 */
.screen .footer-bar,
.screen .charging-bar,
.screen .map-recenter,
.screen .map-preview,
.screen .map-tip { position: absolute; }

.screen .page { min-height: 100%; }

.wx-comp { display: contents; }

/* ------------------------------------------------------------- 状态栏 */

.wx-statusbar {
  height: 44px;
  background: #07c160;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px 0 26px;
  font-size: 13px;
  font-weight: 600;
}

.wx-status-right { display: flex; align-items: center; gap: 5px; }
.wx-signal { display: flex; align-items: flex-end; gap: 1.5px; height: 9px; }
.wx-signal i { display: block; width: 3px; background: #fff; border-radius: 1px; }
.wx-signal i:nth-child(1) { height: 3px; }
.wx-signal i:nth-child(2) { height: 5px; }
.wx-signal i:nth-child(3) { height: 7px; }
.wx-signal i:nth-child(4) { height: 9px; }
.wx-wifi {
  width: 11px; height: 11px; border: 2px solid #fff; border-radius: 50%;
  border-bottom-color: transparent; border-left-color: transparent; transform: rotate(45deg);
}
.wx-battery {
  width: 22px; height: 11px; border: 1.5px solid rgba(255,255,255,0.75); border-radius: 3px;
  position: relative; padding: 1.5px;
}
.wx-battery::before { content: ''; display: block; width: 70%; height: 100%; background: #fff; border-radius: 1px; }
.wx-battery::after {
  content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px;
  background: rgba(255,255,255,0.75); border-radius: 0 1px 1px 0;
}

/* ------------------------------------------------------------- 导航栏 */

.wx-navbar {
  height: 44px;
  background: #07c160;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 12px;
  position: relative;
}

.wx-back {
  width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(45deg); margin-left: 6px;
}

.wx-title {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 16px; font-weight: 500;
}

.wx-capsule {
  margin-left: auto; display: flex; align-items: center; gap: 0;
  width: 78px; height: 30px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.16);
  justify-content: space-around; z-index: 1;
}
.wx-dots { width: 16px; height: 3px; border-radius: 2px; background: #fff; position: relative; }
.wx-dots::before, .wx-dots::after {
  content: ''; position: absolute; top: 0; width: 3px; height: 3px; border-radius: 50%;
  background: #07c160;
}
.wx-dots::before { left: 4px; }
.wx-dots::after { right: 4px; }
.wx-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.35); }
.wx-target { width: 13px; height: 13px; border: 2px solid #fff; border-radius: 50%; position: relative; }
.wx-target::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
  margin: -2px 0 0 -2px; border-radius: 50%; background: #fff;
}

/* -------------------------------------------------------------- tabBar */

.wx-tabbar {
  height: 50px;
  background: #fff;
  border-top: 1px solid #eef0f2;
  display: flex;
  align-items: center;
}

.wx-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; color: #9aa0a6;
}
.wx-tab.active { color: #07c160; }
.wx-tab img { width: 22px; height: 22px; }

/* ---------------------------------------------------------------- 地图 */

.wx-map-canvas, [data-wx="map"] {
  position: relative;
  background:
    linear-gradient(rgba(255,255,255,0.7) 1px, transparent 1px) 0 0 / 100% 34px,
    linear-gradient(90deg, rgba(255,255,255,0.7) 1px, transparent 1px) 0 0 / 34px 100%,
    linear-gradient(135deg, #e8efe6, #dfeae4 60%, #e6eef2);
  overflow: hidden;
}

.wx-map-canvas { position: absolute; inset: 0; background-color: transparent; }

.wx-map-pin { position: absolute; width: 22px; height: 22px; transform: translate(-50%, -85%); }

.wx-map-note {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  font-size: 10px; color: #7d8a92; background: rgba(255,255,255,0.8);
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
}

/* 静态预览里输入框渲染为 div，保留占位文案的样式 */
.wx-input { display: flex; align-items: center; }

/* 静态页面无法滚动，需要展示首屏之外的内容时用负 margin 模拟滚动位置 */
.wx-scroll { position: relative; }

.screen {
  
  --brand: #07c160;
  --brand-dark: #06ad56;
  --brand-light: #e8f8ee;
  --accent: #ff8a00;
  --accent-light: #fff3e0;
  --danger: #fa5151;
  --danger-light: #ffecec;
  --warn: #ff9d00;
  --info: #3a7afe;
  --info-light: #e8f0ff;

  
  --text: #1f2429;
  --text-2: #576068;
  --muted: #9aa0a6;
  --line: #eef0f2;
  --bg: #f3f5f7;
  --card-bg: #ffffff;

  
  --gap-xs: 4px;
  --gap-sm: 8px;
  --gap: 12px;
  --gap-lg: 16px;
  --radius-sm: 5px;
  --radius: 10px;
  --radius-lg: 14px;

  background-color: var(--bg);
  font-size: 14px;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
}
.screen .page {
  min-height: var(--vh);
  box-sizing: border-box;
}
.screen .page-with-footer {
  padding-bottom: 100px;
}
.screen .ic {
  position: relative;
  display: inline-block;
  width: 1em;
  height: 1em;
  vertical-align: -0.14em;
  flex-shrink: 0;
}
.screen .ic::before, .screen .ic::after {
  content: '';
  position: absolute;
  box-sizing: border-box;
}
.screen .ic-pin::before {
  left: 14%;
  top: 6%;
  width: 72%;
  height: 72%;
  border: 0.12em solid currentColor;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}
.screen .ic-pin::after {
  left: 38%;
  top: 28%;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: currentColor;
}
.screen .ic-search::before {
  left: 6%;
  top: 6%;
  width: 62%;
  height: 62%;
  border: 0.12em solid currentColor;
  border-radius: 50%;
}
.screen .ic-search::after {
  left: 60%;
  top: 62%;
  width: 36%;
  height: 0.12em;
  background: currentColor;
  border-radius: 0.12em;
  transform: rotate(45deg);
  transform-origin: left center;
}
.screen .ic-scan::before {
  left: 6%;
  top: 10%;
  width: 88%;
  height: 80%;
  border: 0.12em solid currentColor;
  border-radius: 0.16em;
}
.screen .ic-scan::after {
  left: 6%;
  top: 47%;
  width: 88%;
  height: 0.12em;
  background: currentColor;
}
.screen .ic-map::before {
  left: 4%;
  top: 14%;
  width: 92%;
  height: 72%;
  border: 0.12em solid currentColor;
  border-radius: 0.12em;
}
.screen .ic-map::after {
  left: 36%;
  top: 14%;
  width: 0.12em;
  height: 72%;
  background: currentColor;
}
.screen .ic-list::before {
  left: 6%;
  top: 16%;
  width: 88%;
  height: 34%;
  border-top: 0.12em solid currentColor;
  border-bottom: 0.12em solid currentColor;
}
.screen .ic-list::after {
  left: 6%;
  top: 84%;
  width: 88%;
  height: 0.12em;
  background: currentColor;
}
.screen .ic-locate::before {
  left: 8%;
  top: 8%;
  width: 84%;
  height: 84%;
  border: 0.12em solid currentColor;
  border-radius: 50%;
}
.screen .ic-locate::after {
  left: 34%;
  top: 34%;
  width: 32%;
  height: 32%;
  border-radius: 50%;
  background: currentColor;
}
.screen .ic-compass::before {
  left: 4%;
  top: 4%;
  width: 92%;
  height: 92%;
  border: 0.12em solid currentColor;
  border-radius: 50%;
}
.screen .ic-compass::after {
  left: 30%;
  top: 46%;
  width: 44%;
  height: 0.14em;
  background: currentColor;
  border-radius: 0.14em;
  transform: rotate(-45deg);
}
.screen .ic-copy::before {
  left: 2%;
  top: 2%;
  width: 62%;
  height: 62%;
  border: 0.12em solid currentColor;
  border-radius: 0.12em;
}
.screen .ic-copy::after {
  left: 34%;
  top: 34%;
  width: 64%;
  height: 64%;
  border: 0.12em solid currentColor;
  border-radius: 0.12em;
}
.screen .ic-phone::before {
  left: 24%;
  top: 4%;
  width: 52%;
  height: 92%;
  border: 0.12em solid currentColor;
  border-radius: 0.16em;
}
.screen .ic-phone::after {
  left: 44%;
  top: 76%;
  width: 12%;
  height: 12%;
  border-radius: 50%;
  background: currentColor;
}
.screen .ic-wallet::before {
  left: 2%;
  top: 18%;
  width: 96%;
  height: 64%;
  border: 0.12em solid currentColor;
  border-radius: 0.14em;
}
.screen .ic-wallet::after {
  right: 14%;
  top: 44%;
  width: 0.18em;
  height: 0.18em;
  border-radius: 50%;
  background: currentColor;
}
.screen .ic-doc::before {
  left: 14%;
  top: 2%;
  width: 72%;
  height: 96%;
  border: 0.12em solid currentColor;
  border-radius: 0.1em;
}
.screen .ic-doc::after {
  left: 30%;
  top: 26%;
  width: 40%;
  height: 0.1em;
  background: currentColor;
  box-shadow: 0 0.22em 0 currentColor, 0 0.44em 0 currentColor;
}
.screen .ic-ticket::before {
  left: 2%;
  top: 22%;
  width: 96%;
  height: 56%;
  border: 0.12em solid currentColor;
  border-radius: 0.12em;
}
.screen .ic-ticket::after {
  left: 64%;
  top: 30%;
  width: 0.1em;
  height: 40%;
  background: currentColor;
}
.screen .ic-bolt::before {
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: currentColor;
  clip-path: polygon(64% 4%, 22% 57%, 45% 57%, 37% 96%, 78% 43%, 55% 43%);
}
.screen .ic-car::before {
  left: 2%;
  top: 28%;
  width: 96%;
  height: 42%;
  border: 0.12em solid currentColor;
  border-radius: 0.16em 0.16em 0.08em 0.08em;
}
.screen .ic-car::after {
  left: 18%;
  top: 74%;
  width: 0.18em;
  height: 0.18em;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0.42em 0 0 currentColor;
}
.screen .ic-chat::before {
  left: 4%;
  top: 12%;
  width: 92%;
  height: 60%;
  border: 0.12em solid currentColor;
  border-radius: 0.18em;
}
.screen .ic-chat::after {
  left: 26%;
  top: 66%;
  width: 0;
  height: 0;
  border-left: 0.14em solid transparent;
  border-right: 0.14em solid transparent;
  border-top: 0.24em solid currentColor;
}
.screen .ic-info::before {
  left: 4%;
  top: 4%;
  width: 92%;
  height: 92%;
  border: 0.12em solid currentColor;
  border-radius: 50%;
}
.screen .ic-info::after {
  left: 46%;
  top: 44%;
  width: 0.1em;
  height: 0.28em;
  background: currentColor;
  box-shadow: 0 -0.2em 0 currentColor;
}
.screen .ic-trash::before {
  left: 20%;
  top: 26%;
  width: 60%;
  height: 68%;
  border: 0.12em solid currentColor;
  border-radius: 0 0 0.12em 0.12em;
}
.screen .ic-trash::after {
  left: 8%;
  top: 14%;
  width: 84%;
  height: 0.12em;
  background: currentColor;
  border-radius: 0.12em;
}
.screen .ic-heart::before, .screen .ic-heart::after {
  top: 8%;
  width: 44%;
  height: 68%;
  background: currentColor;
  border-radius: 0.5em 0.5em 0 0;
}
.screen .ic-heart::before {
  left: 50%;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}
.screen .ic-heart::after {
  left: 6%;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}
.screen .ic-plug::before {
  left: 20%;
  top: 32%;
  width: 60%;
  height: 50%;
  border: 0.12em solid currentColor;
  border-radius: 0.1em 0.1em 0.3em 0.3em;
}
.screen .ic-plug::after {
  left: 34%;
  top: 8%;
  width: 0.12em;
  height: 0.26em;
  background: currentColor;
  box-shadow: 0.26em 0 0 currentColor;
}
.screen .card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: var(--gap);
  margin: 10px var(--gap);
  box-shadow: 0 1px 6px rgba(15, 34, 58, 0.05);
}
.screen .card-tight {
  padding: 10px var(--gap);
}
.screen .card-flat {
  box-shadow: none;
  border: 0.5px solid var(--line);
}
.screen .section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}
.screen .section-title .section-sub {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}
.screen .divider {
  height: 0.5px;
  background: var(--line);
  margin: 10px 0;
}
.screen .btn {
  border-radius: 499.5px;
  font-size: 16px;
  line-height: 44px;
  text-align: center;
  transition: opacity 0.15s ease;
}
.screen .btn:active {
  opacity: 0.85;
}
.screen .btn-primary {
  background: linear-gradient(135deg, #13cd73, #07a95c);
  color: #fff;
  border-radius: 499.5px;
  font-size: 16px;
  line-height: 44px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(7, 193, 96, 0.24);
}
.screen .btn-primary:active {
  opacity: 0.88;
}
.screen .btn-primary.disabled, .screen .btn.disabled {
  background: #d5d8dc;
  color: #fff;
  box-shadow: none;
  pointer-events: none;
}
.screen .btn-danger {
  background: linear-gradient(135deg, #ff6b6b, #fa5151);
  color: #fff;
  border-radius: 499.5px;
  font-size: 16px;
  line-height: 44px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(250, 81, 81, 0.22);
}
.screen .btn-ghost {
  background: #fff;
  color: var(--text-2);
  border: 0.5px solid #dfe2e6;
  border-radius: 499.5px;
  font-size: 15px;
  line-height: 40px;
  text-align: center;
}
.screen .btn-mini {
  display: inline-block;
  padding: 0 14px;
  line-height: 28px;
  font-size: 12px;
  border-radius: 499.5px;
  border: 0.5px solid var(--brand);
  color: var(--brand);
  background: #fff;
}
.screen .btn-mini.ghost {
  border-color: #dfe2e6;
  color: var(--text-2);
}
.screen .footer-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  padding: 10px var(--gap-lg) calc(10px + 0px);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 -1px 8px rgba(15, 34, 58, 0.06);
}
.screen .tag {
  display: inline-block;
  font-size: 10px;
  line-height: 16px;
  padding: 0 6px;
  border-radius: 3px;
  margin-right: 6px;
  color: var(--text-2);
  background: #f2f3f5;
}
.screen .tag-fast {
  color: #ff6f00;
  background: var(--accent-light);
}
.screen .tag-slow {
  color: var(--info);
  background: var(--info-light);
}
.screen .tag-idle {
  color: var(--brand);
  background: var(--brand-light);
}
.screen .tag-busy {
  color: var(--warn);
  background: #fff5e6;
}
.screen .tag-offline {
  color: var(--muted);
  background: #f0f0f0;
}
.screen .tag-plain {
  color: var(--text-2);
  background: #f4f5f7;
}
.screen .price-num {
  color: #ff6f00;
  font-size: 18px;
  font-weight: 700;
}
.screen .price-unit {
  color: var(--muted);
  font-size: 11px;
  margin-left: 2px;
}
.screen .money {
  color: #ff6f00;
  font-weight: 700;
}
.screen .empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 30px;
  color: var(--muted);
}
.screen .empty-icon {
  font-size: 44px;
  opacity: 0.5;
  margin-bottom: 10px;
}
.screen .empty-text {
  font-size: 14px;
}
.screen .empty-sub {
  font-size: 12px;
  margin-top: 6px;
  color: #b6bbc0;
}
.screen .skeleton {
  background: linear-gradient(90deg, #eef0f2 25%, #f6f7f8 37%, #eef0f2 63%);
  background-size: 400% 100%;
  animation: skeleton-loading 1.2s ease infinite;
  border-radius: 4px;
}
@keyframes skeleton-loading {
  0% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0 50%;
  }
}
.screen .loading-line {
  height: 14px;
  margin-bottom: 8px;
}
.screen .list-row {
  display: flex;
  align-items: center;
  padding: 13px 0;
  border-bottom: 0.5px solid var(--line);
}
.screen .list-row:last-child {
  border-bottom: none;
}
.screen .list-row .row-icon {
  width: 28px;
  font-size: 17px;
  text-align: center;
}
.screen .list-row .row-label {
  flex: 1;
  font-size: 14px;
  margin-left: 6px;
}
.screen .list-row .row-value {
  font-size: 13px;
  color: var(--muted);
}
.screen .list-row .row-arrow {
  color: #c8ccd0;
  font-size: 14px;
  margin-left: 5px;
}
.screen .info-row {
  display: flex;
  margin-top: 7px;
  font-size: 13px;
  line-height: 1.5;
}
.screen .info-label {
  color: var(--muted);
  width: 70px;
  flex-shrink: 0;
}
.screen .info-value {
  flex: 1;
  color: var(--text);
}
.screen .text-muted {
  color: var(--muted);
}
.screen .text-brand {
  color: var(--brand);
}
.screen .ellipsis {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* pages/index/index */
.p-index .page {
  padding-bottom: 30px;
}
.p-index .header {
  background: linear-gradient(180deg, #07c160 0%, #06ad56 58%, #f3f5f7 58%, #f3f5f7 100%);
  padding: 10px 12px 2px;
}
.p-index .header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
  padding: 2px 2px 9px;
}
.p-index .location {
  display: flex;
  align-items: center;
  font-size: 13.5px;
}
.p-index .location-icon {
  margin-right: 4px;
  font-size: 13px;
}
.p-index .view-toggle {
  display: flex;
  align-items: center;
  font-size: 12px;
  background: rgba(255, 255, 255, 0.22);
  padding: 4px 11px;
  border-radius: 499.5px;
}
.p-index .view-toggle-text {
  margin-left: 4px;
}
.p-index .view-toggle:active {
  opacity: 0.8;
}
.p-index .search-row {
  display: flex;
  align-items: center;
}
.p-index .search-box {
  flex: 1;
  display: flex;
  align-items: center;
  background: #fff;
  border-radius: 499.5px;
  padding: 0 12px;
  height: 38px;
  box-shadow: 0 2px 7px rgba(15, 34, 58, 0.08);
}
.p-index .search-icon {
  font-size: 13px;
  margin-right: 6px;
  opacity: 0.6;
}
.p-index .search-input {
  flex: 1;
  font-size: 13.5px;
  height: 38px;
  line-height: 38px;
}
.p-index .search-placeholder {
  color: #b6bbc0;
  font-size: 13px;
}
.p-index .search-clear {
  font-size: 13px;
  color: #b6bbc0;
  padding: 0 2px 0 6px;
}
.p-index .scan-btn {
  margin-left: 8px;
  width: 54px;
  height: 38px;
  border-radius: 10px;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 7px rgba(15, 34, 58, 0.08);
}
.p-index .scan-btn:active {
