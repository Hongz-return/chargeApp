name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 工程校验与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 校验 + 测试
        run: npm run check

  smoke:
    name: 本地后端冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 冒烟脚本自己在随机空闲端口起一个 server/ 实例，不需要先 npm start
      - name: 后端闭环冒烟
        run: npm run smoke

  docker:
    name: 后端镜像可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 是上线手册里的第一条路径，坏了要在合并前就知道
      - name: 构建镜像
        run: docker build -t charging-pile-server:ci .

      - name: 起容器并检查健康检查
        run: |
          docker run -d --name charging-api-ci -p 3000:3000 \
            -e JWT_SECRET=ci-only-secret-0123456789abcdef \
            charging-pile-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker rm -f charging-api-ci

  assets:
    name: 生成物一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 图标、预览页与界面图都是脚本生成的，重跑后不应产生 diff，
      # 否则说明仓库里的生成物与生成脚本已经不同步。
      - name: 重新生成图标与演示资产
        run: npm run build:assets

      - name: 检查生成物是否与仓库一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::生成物与脚本输出不一致，请在本地执行 npm run build:assets 后提交。"
            git status --porcelain
            git diff
            exit 1
          fi
